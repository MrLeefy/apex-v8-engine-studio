<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V8 Drive Lab 8.4</title>
<style>
html,body{margin:0;height:100%;background:#e9ebec;color:#182026;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}
#load{letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:24px}
#err{max-width:720px;white-space:pre-wrap;text-align:left;line-height:1.45}
</style>
</head>
<body>
<div id="load">Loading V8 Drive Lab 8.4…</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/MrLeefy/apex-v8-engine-studio/deploy-v8-drive-lab-8-4/deploy/v8-8.4/payload.b64';
    const r=await fetch(url,{cache:'force-cache'});
    if(!r.ok) throw new Error('Asset download failed: HTTP '+r.status);
    const b64=(await r.text()).trim();
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(typeof DecompressionStream!=='function') throw new Error('This browser does not support DecompressionStream. Use a current Chrome, Edge, Firefox, or Safari browser.');
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div id="err"><h2>V8 Drive Lab could not start</h2><p>'+String(e&&e.message||e)+'</p><p>Refresh once, or open in a current browser.</p></div>';
  }
})();
</script>
</body>
</html>
